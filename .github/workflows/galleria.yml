name: Aggiorna galleria
on:
  push:
    paths: ['images/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: pip install pillow
      - run: python3 .github/scripts/galleria.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add galleria/foto.json galleria/immagini.json
          git diff --staged --quiet || (git commit -m "Aggiorna galleria" && git push)
